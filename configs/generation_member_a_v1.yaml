version: 1
seed: 42

model:
  type: sequence_vae
  architecture: gru
  embedding_dim: 32
  hidden_dim: 128
  latent_dim: 32
  encoder_layers: 1
  decoder_layers: 1
  dropout: 0.0
  maximum_sequence_length: 180
  training:
    batch_size: 64
    epochs: 100
    learning_rate: 0.001
    kl_beta: 0.1
    kl_warmup_epochs: 20
    early_stopping_patience: 15
    gradient_clip_norm: 1.0
    num_workers: 0
    posterior_collapse_kl_threshold: 0.01

data:
  verification_status: pending_final_family_verification_member_a_v1_conservative_provisional
  reference_fasta: data/processed/gv02_03_v2/member_b_handoff/gvpa_training_eligible.fasta
  release_manifest: data/processed/gv02_03_v2/member_b_handoff/release_manifest.json
  split_manifest: data/processed/gv02_03_v2/member_b_handoff/development_split/split_manifest.json

vocabulary:
  special_tokens: ["<PAD>", "<BOS>", "<EOS>", "<UNK>"]
  amino_acids: "ACDEFGHIKLMNPQRSTVWY"

generation:
  candidate_count: 1000
  batch_size: 64
  minimum_sequence_length: 50
  sampling_temperature: 1.0
  top_k: 0
  top_p: 1.0
  final_selection_budgets: [10, 20, 50]

outputs:
  data_dir: data/processed/gv02_03_v2/member_b_handoff/development_split
  vocabulary: data/processed/gv02_03_v2/member_b_handoff/development_split/vocabulary.json
  model_dir: models/generator/sequence_vae/member_a_v1_seed42
  candidate_output_dir: data/generated/sequence_vae/member_a_v1_seed42
