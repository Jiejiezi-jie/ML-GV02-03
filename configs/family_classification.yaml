# Frozen exploratory thresholds; not fitted on generated candidates.
sources:
  - data/raw/curated/uniprot_reviewed_gvpa_gvpj.fasta
  - data/raw/t05/gvpa/GvpA_RefSeq.fasta
  - data/raw/t05/gvpa/GvpA_NotPartial.fasta
  - data/raw/t05/gvpa/rescued_GvpA_candidates.fasta
  - data/raw/design/GvpA.fasta
  - data/raw/t05/real_gvp.fasta
candidates: data/candidates/t05/generated_gvp.fasta
pfam_model: models/pfam/PF00741.hmm
reference_dir: data/processed/gv02_03_v2/reference
profile_dir: models/family_profiles
result_dir: results/gv02_03_v2/family
folds: 3
cluster_identity: 0.70
cluster_coverage: 0.80
