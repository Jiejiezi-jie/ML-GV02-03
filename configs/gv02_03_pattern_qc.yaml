seed: 42
threads: 8

inputs:
  candidates: data/generated/sequence_vae/member_a_v1_seed42/vae_candidates.fasta
  qc_training_fasta: data/processed/gv02_03_v2/member_b_handoff/development_split/train.fasta
  qc_reference_fasta: data/processed/gv02_03_v2/member_b_handoff/gvpa_training_eligible.fasta

quality:
  minimum_length: 50
  maximum_length: 180
  minimum_unique_residues: 8
  maximum_single_residue_fraction: 0.35
  generation_length_cap: 180
  exact_training_match_action: warn
  exact_reference_match_action: warn
  # Calibrated against the provisional conservative GvpA reference distribution.
  composition_outlier_quantile: 0.99
  composition_outlier_action: warn
  # Provisional exact-pattern alerts only; not TM or domain predictions.
  hydrophobic_run_minimum: 18
  homopolymer_minimum: 6
  tandem_repeat_minimum_length: 12
  tandem_repeat_minimum_copies: 3
  tandem_repeat_maximum_motif_length: 6
